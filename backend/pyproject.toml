[project]
name = "carteira-dividendos"
version = "0.1.0"
description = "Assistente local de investimentos em dividendos (método Barsi) — API"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "yfinance>=0.2.50",
    "apscheduler>=3.10,<4",
    "typer>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true
skip_empty = true

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# E/F/W: pycodestyle e pyflakes · I: imports · B: bugbear · UP: pyupgrade · SIM: simplify
# C4: comprehensions · PIE/RET: código redundante · PT: estilo pytest · PERF: performance · RUF: regras do ruff
# ASYNC: bloqueio dentro de código async · LOG/G: uso do logging · T20: print esquecido · BLE: except Exception sem motivo
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PT", "PERF", "RUF", "ASYNC", "LOG", "G", "T20", "BLE"]
ignore = [
    "B008",    # Depends() em default de parâmetro é o padrão do FastAPI
    "E501",    # comprimento de linha fica com o formatador
    "RUF001",  # textos em pt-BR usam × e – de propósito
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["W291"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_equality = true
