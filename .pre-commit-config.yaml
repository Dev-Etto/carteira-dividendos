repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && uv run ruff check --fix app tests tools alembic && uv run ruff format app tests tools alembic'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: backend-regras-da-casa
        name: regras da casa (backend)
        entry: bash -c 'cd backend && uv run python -m tools.style_rules app tests tools alembic'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: backend-mypy
        name: mypy (backend)
        entry: bash -c 'cd backend && uv run mypy app tools'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: frontend
        name: eslint, tsc e prettier (frontend)
        entry: bash -c 'cd frontend && npm run format && npm run lint && npm run typecheck'
        language: system
        files: ^frontend/
        pass_filenames: false
