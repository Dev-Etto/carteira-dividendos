name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check app tests tools alembic
          uv run ruff format --check app tests tools alembic
          uv run mypy app tools
          uv run python -m tools.style_rules app tests tools alembic
      - name: Testes com cobertura
        run: uv run pytest -q --cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: |
          npm run lint
          npm run typecheck
          npm run format:check
      - run: npm test
      - run: npm run build

  contrato-api:
    name: Tipos do front em dia com a API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd backend && uv sync --locked
      - run: cd frontend && npm ci
      - run: make types-check

  docker:
    name: Imagens Docker
    env:
      INITIAL_SYNC: "false"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build das imagens
        run: docker compose build
      - name: Sobe e confere API e front
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs
      - name: Derruba
        if: always()
        run: docker compose down -v
